<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字 · 聊天 · 我不知道</title>
  <style>
    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }

    /* 聊天卡片 — 仿微信深色模式 */
    .chat-card {
      max-width: 480px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 28px 28px 20px 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 0 1px #2a2a2a inset;
      padding: 20px 18px 24px;
      display: flex;
      flex-direction: column;
      min-height: 500px;
      max-height: 700px;
      height: 80vh;
      position: relative;
    }

    /* ===== 聊天头部 ===== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .chat-header .avatar {
      width: 42px;
      height: 42px;
      background: #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      border: 2px solid #3a3a3a;
    }

    .chat-header .info {
      flex: 1;
    }

    .chat-header .info .name {
      font-size: 1.0rem;
      font-weight: 600;
      color: #e8e0d8;
    }

    .chat-header .info .status {
      font-size: 0.7rem;
      color: #4a4a4a;
      letter-spacing: 0.5px;
    }

    .chat-header .close-btn {
      color: #4a4a4a;
      font-size: 1.2rem;
      cursor: default;
    }

    /* ===== 消息区域 ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      min-height: 200px;
      cursor: pointer;
    }

    /* 消息气泡 */
    .message {
      max-width: 82%;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }

    .message-left {
      align-self: flex-start;
      background: #2a2a2a;
      color: #d0c8c0;
      border-bottom-left-radius: 6px;
      border: 1px solid #333;
    }

    .message-right {
      align-self: flex-end;
      background: #1a4a6a;
      color: #f0ece4;
      border-bottom-right-radius: 6px;
      border: 1px solid #2a5a7a;
    }

    .message-system {
      align-self: center;
      background: #1a1a1a;
      color: #4a4a4a;
      font-size: 0.75rem;
      padding: 4px 16px;
      border-radius: 30px;
      border: 1px solid #2a2a2a;
      max-width: 90%;
    }

    /* 打字指示器 */
    .typing-indicator {
      align-self: flex-start;
      background: #2a2a2a;
      padding: 10px 18px;
      border-radius: 16px;
      border-bottom-left-radius: 6px;
      border: 1px solid #333;
      display: none;
      gap: 4px;
      align-items: center;
    }

    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      background: #6a6a6a;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 输入区域 ===== */
    .chat-input-area {
      display: flex;
      gap: 10px;
      border-top: 1px solid #2a2a2a;
      padding-top: 14px;
      flex-shrink: 0;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 24px;
      border: 1px solid #2a2a2a;
      background: #0d0d0d;
      color: #e8e0d8;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    .chat-input-area input:focus {
      border-color: #1a4a6a;
      box-shadow: 0 0 20px rgba(26, 74, 106, 0.1);
    }

    .chat-input-area input::placeholder {
      color: #4a4a4a;
    }

    .chat-input-area .send-btn {
      background: #1a4a6a;
      border: none;
      color: #f0ece4;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #2a5a7a;
      white-space: nowrap;
    }

    .chat-input-area .send-btn:hover {
      background: #2a5a7a;
      transform: scale(0.97);
    }

    .chat-input-area .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      .chat-card { padding: 16px 14px 20px; border-radius: 20px; height: 90vh; }
      .message { font-size: 0.9rem; padding: 8px 14px; }
      .chat-header .info .name { font-size: 0.9rem; }
      .chat-input-area input { font-size: 0.85rem; padding: 8px 14px; }
      .chat-input-area .send-btn { padding: 8px 16px; font-size: 0.8rem; }
    }

    @media (max-width: 380px) {
      .chat-card { padding: 12px 10px 16px; }
      .message { font-size: 0.82rem; padding: 6px 12px; }
    }

    /* ===== 滚动条美化 ===== */
    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="chat-card" id="chatCard">
  <!-- ===== 聊天头部 ===== -->
  <div class="chat-header">
    <div class="avatar">🦞</div>
    <div class="info">
      <div class="name">水家海鲜 · 程静言</div>
      <div class="status">在线 · 对方正在输入...</div>
    </div>
    <div class="close-btn">⋯</div>
  </div>

  <!-- ===== 消息区域 ===== -->
  <div class="chat-messages" id="chatMessages">
    <!-- 消息由 JS 动态渲染 -->
  </div>

  <!-- ===== 输入区域 ===== -->
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="输入消息..." autocomplete="off" disabled>
    <button class="send-btn" id="sendBtn" disabled>发送</button>
  </div>
</div>

<script>
  (function() {
    // ===== DOM 引用 =====
    const messagesEl = document.getElementById('chatMessages');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // ===== 状态 =====
    let isProcessing = false;
    let hasSentWhy = false;      // 是否已发送 "为什么"
    let hasReplied = false;      // 是否已回复 "我不知道"

    // ===== 添加消息 =====
    function addMessage(text, type = 'left') {
      const div = document.createElement('div');
      div.className = `message message-${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ===== 添加系统消息 =====
    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message message-system';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ===== 显示打字指示器 =====
    function showTyping(show) {
      let indicator = document.querySelector('.typing-indicator');
      if (show) {
        if (!indicator) {
          indicator = document.createElement('div');
          indicator.className = 'typing-indicator';
          for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            dot.className = 'dot';
            indicator.appendChild(dot);
          }
          messagesEl.appendChild(indicator);
        }
        indicator.style.display = 'flex';
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else {
        if (indicator) {
          indicator.style.display = 'none';
        }
      }
    }

    // ===== 禁用输入 =====
    function disableInput() {
      inputEl.disabled = true;
      sendBtn.disabled = true;
    }

    // ===== 核心：点击聊天框自动发送 "为什么" =====
    function triggerWhy() {
      if (isProcessing) return;
      if (hasSentWhy) return;  // 已经发送过了

      isProcessing = true;
      hasSentWhy = true;

      // 在输入框显示 "为什么" 并发送（模拟用户发送）
      addMessage('为什么', 'right');

      // 显示打字指示器（对方正在输入）
      showTyping(true);

      // 间隔 1.5 秒后回复 "我不知道"
      setTimeout(() => {
        showTyping(false);
        addMessage('我不知道', 'left');
        hasReplied = true;

        // 显示系统消息，准备跳转
        addSystemMessage('⏳ 即将跳转...');

        // 间隔 0.8 秒后跳转
        setTimeout(() => {
          window.location.href = '1end.html';
        }, 800);
      }, 1500);
    }

    // ===== 初始化聊天 =====
    function initChat() {
      messagesEl.innerHTML = '';
      // 显示初始消息 "你是谁"（来自对方）
      addMessage('你是谁', 'left');
      // 禁用输入框（只允许点击聊天框触发）
      disableInput();
      // 添加系统提示
      addSystemMessage('💬 点击聊天框自动发送 "为什么"');
      hasSentWhy = false;
      hasReplied = false;
      isProcessing = false;
    }

    // ===== 事件绑定 =====
    // 点击消息区域触发 "为什么"
    messagesEl.addEventListener('click', function(e) {
      // 如果已经发送过 "为什么" 或者正在处理，忽略
      if (hasSentWhy || isProcessing) return;
      triggerWhy();
    });

    // ===== 启动 =====
    initChat();

    console.log('🦞 聊天已初始化');
    console.log('📌 点击聊天框自动发送 "为什么" → 回复 "我不知道" → 跳转 1end.html');
  })();
</script>

</body>
</html>
