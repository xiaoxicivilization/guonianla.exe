<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小希的1gsa2aah3mas4evj</title>
  <style>
    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      padding: 24px;
      margin: 0;
    }

    /* 主卡片 — 纯黑，与背景融合 */
    .stage {
      max-width: 700px;
      width: 100%;
      background: #000000;
      border-radius: 48px 48px 32px 32px;
      padding: 48px 40px 56px;
      box-shadow: none;
      text-align: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 文字显示区域 — 居中 */
    .text-display {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .main-text {
      font-size: 3.2rem;
      font-weight: 600;
      color: #f0ece4;
      letter-spacing: 4px;
      line-height: 1.3;
      transition: all 0.2s ease;
      text-shadow: 0 0 30px rgba(255,255,240,0.05);
      word-break: break-word;
    }

    /* 红色文字（特殊状态） */
    .main-text.red {
      color: #ff1a1a;
      text-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.3);
      animation: pulseRed 1.2s infinite alternate;
    }

    @keyframes pulseRed {
      0% { text-shadow: 0 0 30px rgba(255, 0, 0, 0.3); }
      100% { text-shadow: 0 0 60px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.4); }
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .stage { padding: 36px 24px; min-height: 240px; }
      .main-text { font-size: 2.4rem; }
    }

    @media (max-width: 380px) {
      .main-text { font-size: 1.8rem; }
      .stage { padding: 28px 16px; min-height: 200px; }
    }

    .cursor-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ff1a1a;
      border-radius: 50%;
      margin-left: 6px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="stage" id="stage">
  <div class="text-display" id="textDisplay">
    <div class="main-text" id="mainText">你，你知道我？</div>
  </div>
</div>

<script>
  (function() {
    // 文字序列 — 只保留核心文字，无任何辅助提示
    const steps = [
      {
        main: '你，你知道我？',
        red: false,
        easterEgg: false
      },
      {
        main: '你，',
        red: false,
        easterEgg: false
      },
      {
        main: '不是一般人',
        red: true,
        easterEgg: true
      }
    ];

    const stage = document.getElementById('stage');
    const mainTextEl = document.getElementById('mainText');

    let currentStep = 0;
    let isWaitingForJump = false;

    function renderStep(index) {
      const step = steps[index];
      if (!step) return;

      mainTextEl.textContent = step.main;

      if (step.red) {
        mainTextEl.classList.add('red');
      } else {
        mainTextEl.classList.remove('red');
      }
    }

    function handleStageClick() {
      if (isWaitingForJump) return;

      const currentStepData = steps[currentStep];
      if (currentStepData && currentStepData.easterEgg === true) {
        isWaitingForJump = true;
        window.location.href = 'CDXX.html';
        return;
      }

      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep(currentStep);
      }
    }

    // 初始化
    renderStep(0);

    // 事件绑定
    stage.addEventListener('click', handleStageClick);

    document.addEventListener('keydown', function(e) {
      if (e.key === ' ' || e.key === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        handleStageClick();
      }
    });

    console.log('✨ 纯文字互动 | 点击画面或按空格/回车推进');
    console.log('📌 步骤: 0 → “你，你知道我？”  1 → “你，”  2 → “不是一般人”(红色+彩蛋跳转CDXX.html)');
  })();
</script>

</body>
</html>
