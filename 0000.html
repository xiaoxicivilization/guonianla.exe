<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面未找到 | 何东市人民政府</title>
  <style>
    /* ===== 全局重置 & 字体 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f0f3f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* ===== 主容器 ===== */
    .gov-wrapper {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 20, 40, 0.08), 0 2px 8px rgba(0,0,0,0.02);
      padding: 40px 44px 48px;
      border: 1px solid #dce2ea;
      transition: all 0.2s;
      text-align: center;
    }

    /* ===== 顶部标识 ===== */
    .top-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e6ecf3;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .top-brand .brand-icon {
      background: #b1001e;
      color: white;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .top-brand .brand-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b2a44;
      letter-spacing: 3px;
    }

    .top-brand .brand-sub {
      font-size: 0.8rem;
      color: #4a637c;
      background: #eef3f9;
      padding: 2px 16px;
      border-radius: 20px;
      border: 1px solid #d7e0ea;
      font-weight: 400;
    }

    /* ===== 404 主内容 ===== */
    .error-content {
      padding: 20px 10px 10px;
    }

    .error-icon {
      font-size: 6rem;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #b1001e;
      letter-spacing: 8px;
      text-shadow: 2px 2px 0 rgba(177, 0, 30, 0.10);
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #122b42;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    .error-desc {
      font-size: 1.05rem;
      color: #4a637c;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 28px;
    }

    .error-desc strong {
      color: #1f3a57;
    }

    /* ===== 返回按钮 ===== */
    .btn-home {
      display: inline-block;
      background: #1d3e58;
      color: #ffffff;
      padding: 12px 44px;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      transition: 0.15s;
      border: 1px solid #2a4a66;
      letter-spacing: 1px;
      box-shadow: 0 4px 8px rgba(26, 58, 92, 0.12);
    }

    .btn-home:hover {
      background: #b1001e;
      border-color: #8f0018;
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(177, 0, 30, 0.20);
    }

    /* ===== 底部 ===== */
    .footer-gov {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #e6ecf4;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #6b839b;
      letter-spacing: 0.3px;
      gap: 8px;
    }

    .footer-gov span {
      background: #f0f5fc;
      padding: 4px 20px;
      border-radius: 20px;
      border: 1px solid #e3eaf3;
    }

    .footer-gov a {
      color: #1f4a72;
      text-decoration: none;
      margin: 0 4px;
    }

    .footer-gov a:hover {
      text-decoration: underline;
    }

    /* ===== 版权信息 ===== */
    .footer-copyright {
      text-align: center;
      font-size: 0.75rem;
      color: #889fb3;
      border-top: 1px solid #e4ebf3;
      padding-top: 14px;
      margin-top: 18px;
      letter-spacing: 0.5px;
    }

    .footer-copyright a {
      color: #1f4a72;
      text-decoration: none;
      margin: 0 4px;
    }

    .footer-copyright a:hover {
      text-decoration: underline;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .gov-wrapper { padding: 30px 20px 32px; }
      .top-brand .brand-text { font-size: 1.4rem; }
      .error-code { font-size: 3.6rem; letter-spacing: 4px; }
      .error-title { font-size: 1.4rem; }
      .error-icon { font-size: 4.5rem; }
      .btn-home { padding: 10px 32px; font-size: 0.95rem; }
    }

    @media (max-width: 400px) {
      .gov-wrapper { padding: 20px 14px 24px; }
      .top-brand .brand-text { font-size: 1.2rem; letter-spacing: 1px; }
      .top-brand .brand-icon { font-size: 0.9rem; padding: 4px 12px; }
      .error-code { font-size: 2.8rem; }
      .error-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="gov-wrapper">
  <!-- ===== 顶部品牌标识 ===== -->
  <div class="top-brand">
    <span class="brand-icon">🏛 何东</span>
    <span class="brand-text">市人民政府</span>
    <span class="brand-sub">门户网站</span>
  </div>

  <!-- ===== 404 错误内容 ===== -->
  <div class="error-content">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <div class="error-title">页面未找到</div>
    <div class="error-desc">
      很抱歉，您访问的页面可能已被移除、更名，或暂时不可用。<br>
      请检查网址是否正确，或点击下方按钮返回首页。
    </div>

    <a href="0101.html" class="btn-home">🏠 返回 · 主页</a>
  </div>

  <!-- ===== 底部 ===== -->
  <div class="footer-gov">
    <span>何东市人民政府 · 门户网站</span>
    <span>
      <a href="#">网站地图</a> | <a href="#">联系我们</a>
    </span>
  </div>

  <!-- ===== 版权信息 ===== -->
  <div class="footer-copyright">
    【版权】：本作品为小希初步作品，如有大佬点评，请访问 <a href="mailto:xiaoxiwenming@163.com">xiaoxiwenming@163.com</a>
  </div>
</div>
</body>
</html>
