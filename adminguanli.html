<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水家海鲜 · 店长员工内部登记</title>
  <style>
    /* 全局重置 & 字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
    }

    body {
      background: #0b1a2b;
      background-image: radial-gradient(circle at 20% 30%, #1a405a, #06101b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    /* ===== 主卡片 ===== */
    .admin-card {
      max-width: 1100px;
      width: 100%;
      background: linear-gradient(145deg, #fefcf5, #f6f2e8);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 2px #d9c9a8 inset, 0 0 0 4px #bea884 inset;
      padding: 36px 38px 44px;
      position: relative;
      transition: 0.25s ease;
    }

    .admin-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(45deg, rgba(200,180,150,0.03) 0px, rgba(200,180,150,0.03) 8px, transparent 8px, transparent 16px);
      pointer-events: none;
      border-radius: inherit;
    }

    /* ===== 标题区 ===== */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 2px solid #d4c9b8;
      position: relative;
      z-index: 2;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-left .brand-icon {
      font-size: 2.4rem;
    }

    .header-left h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0e2c44;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #b53b1c, #d45a2a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left .sub {
      font-size: 0.8rem;
      color: #4f6b7c;
      background: rgba(255,255,240,0.6);
      padding: 2px 16px;
      border-radius: 60px;
      border: 1px solid #c6b69a;
    }

    .header-right {
      font-size: 0.85rem;
      color: #4f6b7c;
      background: #eef3f9;
      padding: 4px 20px;
      border-radius: 30px;
      border: 1px solid #d7e0ea;
    }

    .header-right a {
      color: #1d3e58;
      text-decoration: none;
      font-weight: 500;
    }

    .header-right a:hover {
      color: #b3411d;
    }

    /* ===== 两栏布局 ===== */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      position: relative;
      z-index: 2;
    }

    /* ===== 分区卡片通用 ===== */
    .section-card {
      background: rgba(255, 252, 245, 0.7);
      backdrop-filter: blur(2px);
      border-radius: 40px 12px 40px 12px;
      padding: 24px 24px 28px;
      border: 1px solid #e2d4be;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      transition: 0.2s;
      min-height: 320px;
    }

    .section-card:hover {
      background: rgba(255, 252, 245, 0.85);
      border-color: #cbb594;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1d3e58;
      border-bottom: 3px dotted #b87a5a;
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title .badge {
      font-size: 0.75rem;
      background: #1d3e58;
      color: #f7efe0;
      padding: 0 16px;
      border-radius: 60px;
      line-height: 1.8;
    }

    /* ===== 子分区（线上付费/免费） ===== */
    .sub-section {
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(255, 248, 240, 0.5);
      border-radius: 30px 8px 30px 8px;
      border-left: 4px solid #b87a5a;
    }

    .sub-section .sub-title {
      font-size: 1.0rem;
      font-weight: 600;
      color: #1d3e58;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sub-section .sub-title .tag {
      font-size: 0.7rem;
      background: #b3411d;
      color: #f5ede0;
      padding: 0 14px;
      border-radius: 60px;
      line-height: 1.6;
    }

    .sub-section .sub-title .tag.free {
      background: #1d7a3e;
    }

    /* ===== 列表项 ===== */
    .item-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 6px;
    }

    .item-tag {
      background: #fcf8f0;
      border: 1px solid #d0bc9e;
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.9rem;
      color: #1f3a4f;
      font-weight: 500;
      box-shadow: 0 2px 0 #b8a68b;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .item-tag .badge-box {
      font-size: 0.65rem;
      background: #b3411d;
      color: #f5ede0;
      padding: 0 8px;
      border-radius: 30px;
      line-height: 1.4;
    }

    .item-tag .badge-box.vip {
      background: #b8860b;
    }

    /* ===== 线下区 ===== */
    .offline-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 6px;
    }

    .offline-item {
      background: #e8e0d4;
      border: 1px solid #c6b69a;
      border-radius: 30px;
      padding: 6px 20px;
      font-size: 0.9rem;
      color: #1f3a4f;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .offline-item .status-tag {
      font-size: 0.65rem;
      background: #1d7a3e;
      color: #f5ede0;
      padding: 0 10px;
      border-radius: 30px;
      line-height: 1.6;
    }

    .offline-item .status-tag.reserved {
      background: #b8860b;
    }

    /* ===== 底部 ===== */
    .footer-bar {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 2px dashed #cbb594;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .footer-bar .back-link {
      color: #4f6b7c;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px dashed #c6b69a;
      padding-bottom: 2px;
      transition: 0.15s;
    }

    .footer-bar .back-link:hover {
      color: #b3411d;
      border-bottom-color: #b3411d;
    }

    .footer-copyright {
      font-size: 0.7rem;
      color: #889fb3;
      letter-spacing: 0.5px;
    }

    .footer-copyright a {
      color: #1f4a72;
      text-decoration: none;
      margin: 0 4px;
    }

    .footer-copyright a:hover {
      text-decoration: underline;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 820px) {
      .two-col {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .admin-card { padding: 28px 20px 32px; }
      .header-left h1 { font-size: 1.3rem; }
    }

    @media (max-width: 480px) {
      .admin-card { padding: 20px 14px 24px; }
      .header-left { flex-wrap: wrap; }
      .header-left h1 { font-size: 1.1rem; }
      .section-title { font-size: 1.2rem; }
      .sub-section { padding: 12px 12px; }
      .item-tag { font-size: 0.8rem; padding: 4px 14px; }
      .offline-item { font-size: 0.8rem; padding: 4px 14px; }
    }
  </style>
</head>
<body>
<div class="admin-card">
  <!-- ===== 标题区 ===== -->
  <div class="header-area">
    <div class="header-left">
      <span class="brand-icon">🦞</span>
      <h1>水家海鲜</h1>
      <span class="sub">🔐 店长员工内部登记</span>
    </div>
    <div class="header-right">
      <a href="admin.html">← 返回主页</a>
    </div>
  </div>

  <!-- ===== 两栏：线上 / 线下 ===== -->
  <div class="two-col">
    <!-- ====== 线上分区 ====== -->
    <div class="section-card">
      <div class="section-title">
        🌐 线上
        <span class="badge">订单</span>
      </div>

      <!-- 付费子分区 -->
      <div class="sub-section">
        <div class="sub-title">
          💰 付费
          <span class="tag">已支付</span>
        </div>
        <div class="item-list">
          <span class="item-tag">📄 word2837498</span>
          <span class="item-tag">📄 word6677668</span>
          <span class="item-tag">📄 word2839023</span>
          <span class="item-tag">
            📄 word1274654
            <span class="badge-box vip">包厢</span>
          </span>
        </div>
      </div>

      <!-- 免费子分区（已更新） -->
      <div class="sub-section">
        <div class="sub-title">
          🆓 免费
          <span class="tag free">过年福利</span>
        </div>
        <div class="item-list">
          <span class="item-tag">📄 word3723873</span>
          <span class="item-tag">📄 word4950987</span>
          <span class="item-tag">📄 word0009998</span>
        </div>
      </div>
    </div>

    <!-- ====== 线下分区 ====== -->
    <div class="section-card">
      <div class="section-title">
        🏠 线下
        <span class="badge">堂食 · 自提</span>
      </div>

      <div style="margin-top: 8px;">
        <p style="color: #4a637c; font-size: 0.95rem; margin-bottom: 14px; padding: 6px 0; border-bottom: 1px dashed #d4c9b8;">
          📋 当前线下登记顾客
        </p>
        <div class="offline-list">
          <span class="offline-item">👤 许知夏</span>
          <span class="offline-item">
            👤 何前程
            <span class="status-tag reserved">2026 已订</span>
          </span>
          <span class="offline-item">👤 周明远</span>
        </div>
        <div style="margin-top: 16px; padding: 12px 16px; background: rgba(200,180,150,0.15); border-radius: 30px; border: 1px dashed #c6b69a;">
          <span style="font-size: 0.85rem; color: #4f6b7c;">➕ 可在此处添加线下登记项（桌号/自提/包厢等）</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 底部 ===== -->
  <div class="footer-bar">
    <a href="admin.html" class="back-link">← 返回·主页</a>
    <div class="footer-copyright">
      【版权】：本作品为小希初步作品，如有大佬点评，请访问 <a href="mailto:xiaoxiwenming@163.com">xiaoxiwenming@163.com</a>
    </div>
  </div>
</div>
</body>
</html>
