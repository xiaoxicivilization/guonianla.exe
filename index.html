<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🌐 网页时光机 · 何东市政府</title>
  <!-- 清新风格，仿古早UI，带一点蒸汽波/磁带机质感 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Courier New', 'JetBrains Mono', system-ui, monospace;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #2b1e2f, #0e0b14);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    /* 时光机主体 —— 复古CRT显示器风格 */
    .time-machine {
      max-width: 800px;
      width: 100%;
      background: #1a141f;
      border: 6px solid #5a4a5e;
      border-radius: 48px 48px 32px 32px;
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(200, 180, 220, 0.2),
        0 0 0 2px #3f2e44 inset;
      padding: 30px 24px 40px;
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }

    /* 屏幕区域 */
    .screen {
      background: #0f0c12;
      border-radius: 28px 28px 20px 20px;
      padding: 28px 22px 30px;
      box-shadow: 
        inset 0 0 30px #050308,
        0 8px 0 #0b080e;
      border: 2px solid #3c2d40;
      margin-bottom: 30px;
      position: relative;
    }

    /* 扫描线 / 老旧屏幕效果 (装饰) */
    .screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(255,255,255,0.02) 2px, transparent 4px);
      pointer-events: none;
      border-radius: 28px;
      opacity: 0.5;
    }

    /* 头部：logo + 标题 */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px dashed #6b5a70;
      padding-bottom: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .logo-icon {
      background: #382b3d;
      padding: 6px 12px 6px 10px;
      border-radius: 60px;
      font-size: 2rem;
      line-height: 1;
      color: #c9b3d1;
      border: 1px solid #6b5573;
      box-shadow: inset 0 0 8px #261f2a;
      letter-spacing: 2px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 300;
    }

    .logo-icon span {
      font-size: 1.1rem;
      background: #221b26;
      padding: 0 10px 0 6px;
      border-radius: 30px;
      color: #bfaac9;
    }

    .title {
      font-size: 1.9rem;
      font-weight: 400;
      letter-spacing: 4px;
      color: #e5d7ec;
      text-shadow: 0 0 6px #a386b0, 0 0 12px #5d3f68;
      font-family: 'Courier New', monospace;
      margin-left: 4px;
    }

    .subhead {
      margin-left: auto;
      font-size: 0.9rem;
      background: #261f2b;
      padding: 8px 16px;
      border-radius: 60px;
      color: #bcacc6;
      border: 1px solid #4d3d53;
      letter-spacing: 1px;
      backdrop-filter: blur(2px);
    }

    /* 政府门面 —— 简版 “何东市政府” 牌匾 */
    .gov-brand {
      background: #1d1622;
      border: 3px solid #6a5572;
      border-radius: 100px 100px 20px 20px;
      padding: 14px 16px 12px;
      margin-bottom: 28px;
      text-align: center;
      box-shadow: inset 0 -4px 0 #382c3e, 0 6px 0 #0d0a10;
    }

    .gov-brand h2 {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 8px;
      color: #f2e6fa;
      text-shadow: 0 0 8px #b394c7, 0 0 18px #7a5e87;
      font-family: 'Times New Roman', 'Songti SC', serif;
      word-break: keep-all;
    }

    .gov-brand small {
      color: #b7a2c1;
      display: block;
      font-size: 0.75rem;
      letter-spacing: 6px;
      margin-top: 4px;
      opacity: 0.7;
      font-family: monospace;
    }

    /* 时光机核心：两个存档卡片 */
    .archive-grid {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 10px;
    }

    .archive-card {
      flex: 1 1 200px;
      min-width: 160px;
      background: #15101b;
      border: 2px solid #4f3d56;
      border-radius: 30px 30px 24px 24px;
      padding: 18px 10px 20px;
      box-shadow: 0 10px 0 #0b080e, inset 0 0 20px #231d29;
      transition: 0.15s linear;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .archive-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 0 #0b080e, 0 0 25px #a77eb9;
      border-color: #a586b5;
      background: #1e1627;
    }

    .archive-card:active {
      transform: translateY(6px);
      box-shadow: 0 6px 0 #0b080e;
    }

    /* 日期大标 */
    .archive-date {
      font-size: 2.6rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      background: #221c28;
      padding: 8px 12px;
      border-radius: 60px;
      color: #dacce3;
      letter-spacing: 2px;
      border: 1px solid #6b5875;
      width: 100%;
      margin-bottom: 12px;
      text-shadow: 0 2px 0 #0b080e;
    }

    .archive-label {
      font-size: 1rem;
      background: #31263a;
      padding: 8px 16px;
      border-radius: 60px;
      color: #d6c3e0;
      border: 1px solid #5e4b66;
      letter-spacing: 2px;
      font-weight: 300;
      margin: 8px 0 6px;
      width: fit-content;
      backdrop-filter: blur(2px);
    }

    .archive-link-hint {
      font-size: 0.8rem;
      background: #1d1624;
      padding: 6px 16px;
      border-radius: 60px;
      color: #a68fb2;
      border: 1px dashed #5b4a62;
      margin-top: 8px;
      font-family: monospace;
      word-break: break-all;
    }

    .archive-link-hint i {
      font-style: normal;
      background: #2b2232;
      padding: 0 8px;
      border-radius: 30px;
      color: #bda9ca;
    }

    /* 脚注：状态 & 操作区 */
    .footer-panel {
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-top: 1px solid #3b2e41;
      padding-top: 22px;
    }

    .status {
      color: #b09db9;
      font-size: 0.85rem;
      background: #1b1421;
      padding: 8px 18px;
      border-radius: 60px;
      border: 1px solid #3d2f43;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
    }

    .status span {
      color: #d6bfe1;
      font-weight: bold;
    }

    .btn-reset {
      background: #251f2b;
      border: none;
      border: 1px solid #604f67;
      color: #cdbcd6;
      padding: 8px 22px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #0b080e;
      font-family: inherit;
    }

    .btn-reset:hover {
      background: #3d2d45;
      border-color: #a384b3;
      color: #f0e2f7;
      transform: scale(0.98);
    }

    .btn-reset:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #0b080e;
    }

    /* 响应式 */
    @media (max-width: 540px) {
      .time-machine {
        padding: 20px 14px 30px;
      }
      .title {
        font-size: 1.4rem;
        letter-spacing: 2px;
      }
      .gov-brand h2 {
        font-size: 1.8rem;
        letter-spacing: 4px;
      }
      .archive-date {
        font-size: 2rem;
      }
      .archive-card {
        flex: 1 1 140px;
        min-width: 120px;
      }
    }

    /* 装饰小字 */
    .crt-flicker {
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.95; }
    }

    /* 两个存档卡片的单独微调——链接颜色保留 */
    .card-20241231 .archive-date { background: #2c1f33; border-color: #8a6f98; }
    .card-20260806 .archive-date { background: #1f2833; border-color: #7a849b; }
  </style>
</head>
<body>
  <div class="time-machine crt-flicker">
    <div class="screen">
      <!-- 头部 -->
      <div class="header">
        <div class="logo-icon">
          🕰️ <span>⏳</span>
        </div>
        <div class="title">时光机</div>
        <div class="subhead">v.1.0</div>
      </div>

      <!-- 何东市政府门面 -->
      <div class="gov-brand">
        <h2>何东市政府</h2>
        <small>▪  portal  ▪  archive  ▪</small>
      </div>

      <!-- 两个存档卡片 点击跳转 -->
      <div class="archive-grid">
        <!-- 2024-12-31 卡片 跳转 0101.html -->
        <div class="archive-card card-20241231" onclick="window.location.href='0101.html'">
          <div class="archive-date">2024.12.31</div>
          <div class="archive-label">📀 存档 · 年末</div>
          <div class="archive-link-hint">
            <i>↗</i> 0101.html
          </div>
        </div>

        <!-- 2026-08-06 卡片 跳转 0.html -->
        <div class="archive-card card-20260806" onclick="window.location.href='0.html'">
          <div class="archive-date">2026.08.06</div>
          <div class="archive-label">📼 存档 · 仲夏</div>
          <div class="archive-link-hint">
            <i>↗</i> 0.html
          </div>
        </div>
      </div>

      <!-- 底部状态 + 重置按钮 (无实际跳转，仅装饰) -->
      <div class="footer-panel">
        <div class="status">
          <span>⏲️</span> 当前状态 · 就绪
        </div>
        <button class="btn-reset" onclick="location.reload();">⟳ 重置</button>
      </div>

      <!-- 微提示：点击卡片跳转 -->
      <div style="text-align: center; margin-top: 18px; font-size: 0.7rem; color: #6f5b78; letter-spacing: 1px; border-top: 1px dashed #362c3b; padding-top: 16px;">
        <span style="background: #1b1521; padding: 4px 18px; border-radius: 40px;">🖱️ 点击日期卡片 · 穿越存档</span>
      </div>
    </div>
    <!-- 装饰底边 -->
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 14px; opacity: 0.2;">
      <span style="width: 8px; height: 8px; background: #7a6585; border-radius: 50%;"></span>
      <span style="width: 8px; height: 8px; background: #7a6585; border-radius: 50%;"></span>
      <span style="width: 8px; height: 8px; background: #7a6585; border-radius: 50%;"></span>
    </div>
  </div>

  <!-- 额外说明：点击卡片直接跳转，无需JS额外绑定，已内联 onclick -->
  <!-- 完全符合需求：点击20241231跳转0101.html；点击20260806跳转0.html -->
</body>
</html>
